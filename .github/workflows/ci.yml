name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        env:
          # Next.js evaluates server environment validation while collecting page data.
          # This is only a build-time placeholder; CI never connects to Firebase.
          FIREBASE_PROJECT_ID: ci-build-project
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build-project
        run: npm run build
